name: Claude Code
version: "0.1.3"
slug: claude_code
description: >-
  An always-on Claude Code session on the Home Assistant box: in the sidebar,
  and on your phone through Remote Control.
url: https://github.com/tgudlek/spilja-ha-apps/tree/main/claude_code
arch:
  - aarch64
  - amd64
init: false            # s6-overlay is PID 1
startup: services      # independent of Core, so it can help when Core is down
boot: auto
stage: experimental
timeout: 30

# Sidebar panel: Supervisor ingress -> nginx (only the ingress proxy, and only
# the users in panel_users) -> ttyd on loopback -> tmux session "claude".
# panel_admin only hides the sidebar entry; panel_users is the access check.
ingress: true
ingress_port: 8099
panel_title: Claude
panel_icon: mdi:robot-outline
panel_admin: true
watchdog: "tcp://[HOST]:[PORT:8099]"

hassio_api: true
hassio_role: manager   # add-on logs and restarts; can also read other add-ons' options and manage backups
homeassistant_api: true

map:
  - type: homeassistant_config   # the live configuration
    path: /config
    read_only: false

# Globs over the full path. Caches, the Claude Code binaries (reinstalled on
# start) and the venv are rebuilt; the clones in work/ are cloned again, but
# anything not pushed is lost with them. The login, transcripts and SSH keys
# in home/ are kept.
backup_exclude:
  - "*/home/.cache/**"
  - "*/home/.local/share/claude/**"
  - "*/home/.npm/**"
  - "*/venv/**"
  - "*/work/**"

options:
  session_name: Home Assistant
  panel_users: []
  model: opus
  effort: xhigh
  ultracode: true
  permission_mode: auto
  update_channel: latest   # new models arrive on latest first
  repositories: []
  ssh_hosts: []
schema:
  session_name: str
  panel_users:
    - "match(^[A-Za-z0-9_.@-]+$)"
  model: str
  effort: list(low|medium|high|xhigh|max)
  ultracode: bool
  permission_mode: list(default|acceptEdits|plan|auto)
  update_channel: list(stable|latest)
  repositories:
    - "match(^git@github\\.com:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\\.git$)"
  working_directory: str?
  memory_directory: str?
  ssh_hosts:
    - "match(^[A-Za-z0-9_-]+=[A-Za-z0-9_.-]+@[A-Za-z0-9_.-]+(:[0-9]{1,5})?$)"
  git_name: str?
  git_email: str?
