# Ingress in front of ttyd. The Supervisor strips the ingress prefix, and
# ttyd builds its URLs from the page's path, so no rewriting is needed.
worker_processes 1;
pid /run/nginx-claude.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The Supervisor sets X-Remote-User-Name to the logged-in Home Assistant
    # user's username and drops any copy the browser sends. panel_admin only
    # hides the sidebar entry, so this is the real access check.
    map $http_x_remote_user_name $panel_user_ok {
        default 0;
        include /run/claude-panel-users.map;   # written by init-claude from panel_users
    }

    server {
        listen 8099;
        allow 172.30.32.2;   # the Supervisor's ingress proxy
        deny all;            # everyone else, including other add-ons

        location / {
            if ($panel_user_ok = 0) {
                return 403 "This Home Assistant user isn't in the Claude Code add-on's panel_users option.\n";
            }
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_buffering off;
        }
    }
}
