# The add-on's tmux session ("claude"): window 0 = Claude Code, 1 = shell.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 0
set -g history-limit 20000
set -g mouse off                  # let the browser select and copy text
set -g base-index 0
set -g renumber-windows on
set -g aggressive-resize on       # phone and laptop tabs don't shrink each other
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] claude #[default]"
set -g status-right "Ctrl-b n: next window  "
set -g window-status-current-style "bold,fg=colour214"
